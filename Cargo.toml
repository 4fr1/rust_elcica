[package]
name = "tes_elcica"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.5.0", features = ["http"] }
askama = "0.12"
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

